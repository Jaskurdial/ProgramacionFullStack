<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Subir Imagen Álbum</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white">
    <div class="container mt-5">
        <h2 class="mb-4">Subir una nueva imagen al álbum</h2>

        <form action="procesar_subida.php" method="POST" enctype="multipart/form-data"
              class="border border-info p-4 rounded-4 shadow-lg">

            <div class="mb-3">
                <input type="text" class="form-control border-info-subtle"
                       name="nombre" placeholder="Nombre de la imagen" required>
            </div>

            <div class="mb-3">
                <textarea class="form-control border-info-subtle"
                          name="descripcion" rows="3" placeholder="Descripción de la imagen" required></textarea>
            </div>

            <div class="mb-3">
                <input class="form-control bg-dark text-white border-info-subtle"
                       type="file" name="archivo" accept=".jpg,.jpeg,.png" required>
            </div>

            <button type="submit" class="btn btn-outline-info">Subir Imagen</button>
        </form>

        <div class="text-center mt-4">
            <a href="galeria.php" class="btn btn-outline-info">Ver galería</a>
        </div>
    </div>
</body>
</html>
