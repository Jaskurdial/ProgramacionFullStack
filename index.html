<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Procesador Meteorológico</title>

    <!-- Carga Bootstrap para estilos rápidos y responsivos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Hoja de estilos personalizada -->
    <link href="estilos.css" rel="stylesheet">
</head>
<body class="bg-dark text-white">

    <div class="container mt-5">
        <div class="card bg-secondary text-white shadow p-4">
            <!-- Título principal -->
            <h2 class="text-center mb-4">Procesador Meteorológico</h2>

            <!-- Subtítulo con instrucciones -->
            <p class="text-center">
                Subí un archivo CSV con datos de temperatura, humedad, lluvia o viento.
            </p>

            <!-- Formulario para subir el archivo -->
            <form action="procesar.php" method="POST" enctype="multipart/form-data" class="text-center">
                
                <!-- Campo para subir el archivo CSV -->
                <div class="mb-3">
                    <input 
                        type="file" 
                        name="archivo" 
                        class="form-control bg-dark text-white" 
                        accept=".csv" 
                        required
                    >
                </div>

                <!-- Texto explicativo para elegir tipo de dato -->
                <p>Seleccioná el tipo de dato que contiene el archivo:</p>

                <!-- Radios para seleccionar qué tipo de datos se están subiendo -->
                <div class="text-start d-grid gap-2 col-md-6 mx-auto mb-4">
                    
                    <!-- Temperatura -->
                    <div class="form-check">
                        <input 
                            class="form-check-input" 
                            type="radio" 
                            name="tipo" 
                            id="radioTemp" 
                            value="temperatura" 
                            required
                        >
                        <label class="form-check-label text-warning" for="radioTemp">
                            Temperatura
                        </label>
                    </div>

                    <!-- Humedad -->
                    <div class="form-check">
                        <input 
                            class="form-check-input" 
                            type="radio" 
                            name="tipo" 
                            id="radioHum" 
                            value="humedad" 
                            required
                        >
                        <label class="form-check-label text-purple" for="radioHum">
                            Humedad
                        </label>
                    </div>

                    <!-- Lluvia -->
                    <div class="form-check">
                        <input 
                            class="form-check-input" 
                            type="radio" 
                            name="tipo" 
                            id="radioLluvia" 
                            value="lluvia" 
                            required
                        >
                        <label class="form-check-label text-primary" for="radioLluvia">
                            Lluvia
                        </label>
                    </div>

                    <!-- Viento -->
                    <div class="form-check">
                        <input 
                            class="form-check-input" 
                            type="radio" 
                            name="tipo" 
                            id="radioViento" 
                            value="viento" 
                            required
                        >
                        <label class="form-check-label text-info" for="radioViento">
                            Viento
                        </label>
                    </div>
                </div>

                <!-- Botón para enviar el formulario -->
                <button type="submit" class="btn btn-outline-light">
                    Procesar archivo
                </button>
            </form>
        </div>
    </div>

</body>
</html>
